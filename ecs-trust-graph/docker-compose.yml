"""
services:
  trust-manager:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m ecs_trust"
    ports:
      - "8080:8080"

  # Optional production ReBAC backend. The Python Trust Manager ships an
  # OpenFGA-compatible in-process engine so the demo runs without Docker.
  openfga:
    image: openfga/openfga:v1.8.12
    command: run
    environment:
      - OPENFGA_PLAYGROUND_ENABLED=true
      - OPENFGA_DATASTORE_ENGINE=memory
    ports:
      - "8081:8080"
      - "3001:3000"
